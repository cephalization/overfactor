  "@hono/node-ws": ^1.3.1
  "@hono/zod-validator": ^0.9.0
  "@tailwindcss/vite": ^4.3.3
  "@tanstack/query-db-collection": ^1.2.4
  "@tanstack/react-db": ^0.2.1
  "@tanstack/react-query": ^5.101.4
  "@types/better-sqlite3": ^9.6.0
  "@types/node": ^24
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.0
  "@pierre/diffs": ^1.3.5
  "@pierre/trees": ^1.0.0-beta.6
  better-sqlite3: ^13.0.3
  chokidar: ^5.0.0
  citty: ^0.2.2
  drizzle-kit: ^0.31.10
  drizzle-orm: ^0.45.2
  electron: ^43.4.0
  electron-builder: ^26.15.3
  electron-vite: ^5.0.0
  emittery: ^2.0.0
  execa: ^10.0.1
  hono: ^4.13.2
  ignore: ^7.0.5
  pino: ^10.3.1
  pino-pretty: ^13.1.3
  partysocket: ^1.3.0
  react: ^19.2.8
  react-dom: ^19.2.8
  tailwindcss: ^4.3.3
  typescript: ^5
  vite-plus: latest
  vitest: ^4.1.10
  zod: ^4.4.3
  radix-ui: ^1.6.7
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  concurrently: ^10.0.5
  streamdown: ^2.5.0
  tailwind-merge: ^3.6.0
  tw-animate-css: ^1.4.0
  lucide-react: ^1.31.0
  react-resizable-panels: ^4.12.2
  oxlint: 1.78.0
  "@oxlint/plugins": 1.78.0
  octokit: ^5.0.5
  cmdk: ^1.1.1

# pnpm 11 fails installs on unreviewed dependency build scripts; approve the
# native/postinstall builds we rely on and keep the rest skipped.
allowBuilds:
  # Pi integration type dependencies; their generated artifacts ship in the package.
  "@google/genai": false
  protobufjs: false
  # just-git devDependencies (bun-only tests); never needed at runtime.
  "@mongodb-js/zstd": false
  better-sqlite3: true
  cpu-features: false
  electron: true
  esbuild: false
  node-liblzma: false
  ssh2: false

minimumReleaseAgeExclude:
  - concurrently@10.0.5
